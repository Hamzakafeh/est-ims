<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>EST | Inventory Management System</title>
<link rel="icon" type="image/x-icon" href="/static/icons/low1.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    cursor: default;
  }
  .eyes {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 6vmin;
  }
  .eye {
    width: 22vmin;
    height: 22vmin;
    background: #ffffff;
    border: 1.1vmin solid #111111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .pupil {
    width: 9vmin;
    height: 9vmin;
    background: #111111;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.05s linear;
  }
</style>
</head>
<body>

<div class="eyes">
  <div class="eye"><div class="pupil" id="pupilL"></div></div>
  <div class="eye"><div class="pupil" id="pupilR"></div></div>
</div>

<script>
(function () {
  var pupils = [
    { el: document.getElementById('pupilL'), eye: null },
    { el: document.getElementById('pupilR'), eye: null }
  ];
  pupils.forEach(function (p) { p.eye = p.el.parentElement; });

  function move(mx, my) {
    pupils.forEach(function (p) {
      var rect = p.eye.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dx = mx - cx;
      var dy = my - cy;
      var angle = Math.atan2(dy, dx);
      // how far the pupil can travel inside the eye
      var maxMove = (rect.width / 2) - (p.el.offsetWidth / 2) - rect.width * 0.06;
      var dist = Math.min(maxMove, Math.hypot(dx, dy));
      var x = Math.cos(angle) * dist;
      var y = Math.sin(angle) * dist;
      p.el.style.transform = 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px))';
    });
  }

  window.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length) move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // center the pupils initially
  move(window.innerWidth / 2, window.innerHeight / 2);
})();
</script>
</body>
</html>
