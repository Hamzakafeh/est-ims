<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone 1 — Soon</title>
  <link rel="icon" type="image/x-icon" href="/static/icons/low1.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #e2e8f0; text-align: center; padding: 24px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .soon-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .soon-logo { width: 72px; height: 72px; object-fit: contain; opacity: .9; }
    .soon-title {
      font-size: clamp(48px, 12vw, 110px); font-weight: 800; letter-spacing: 4px; line-height: 1;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .soon-sub { font-size: 14px; color: #94a3b8; letter-spacing: 1px; }
    .soon-back {
      margin-top: 10px; text-decoration: none; color: #cbd5e1;
      border: 1px solid rgba(59,130,246,.35); background: rgba(59,130,246,.12);
      padding: 9px 22px; border-radius: 30px; font-size: 13px; font-weight: 600; transition: all .18s;
    }
    .soon-back:hover { background: rgba(59,130,246,.25); }
  </style>
</head>
<body>
  <div class="soon-wrap">
    <img class="soon-logo" src="/static/icons/low.ico" alt="EST-iMs">
    <div class="soon-title">Soon</div>
    <div class="soon-sub">Zone 1 is under development</div>
    <a class="soon-back" href="/zones">← Back to Zones</a>
  </div>
</body>
</html>
